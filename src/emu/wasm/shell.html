<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>EKA2L1 - Symbian Emulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #1a1a2e; color: #eee; font-family: monospace; display: flex; flex-direction: column; height: 100vh; }
        #controls { padding: 8px; background: #16213e; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        #controls label { font-size: 13px; }
        #controls input[type=file] { font-size: 13px; }
        #controls button { padding: 4px 12px; cursor: pointer; font-family: monospace; }
        #game-picker { padding: 8px; background: #16213e; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        #game-picker select, #game-picker button { font: inherit; padding: 6px; }
        #game-picker[hidden], #controls[hidden] { display: none; }
        #canvas-container { flex: 1; display: flex; justify-content: center; align-items: center; background: #000; }
        canvas { border: 1px solid #333; max-width: 100%; max-height: 100%; object-fit: contain; }
        #canvas-container { min-height: 0; }
        #game-controls { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 6px; }
        #game-controls button { min-width: 46px; min-height: 40px; touch-action: none; user-select: none; }
        #game-controls[hidden] { display: none; }
        #log-panel summary { padding: 4px 8px; cursor: pointer; background: #0f0f23; }
        #log { height: 150px; overflow-y: auto; padding: 4px 8px; background: #0f0f23; font-size: 12px; border-top: 1px solid #333; white-space: pre-wrap; }
        #status { padding: 4px 8px; background: #16213e; font-size: 12px; }
    </style>
    <link rel="stylesheet" href="touch-controls.css">
</head>
<body>
    <script src="audio.js"></script>
    <dialog id="session-panel" aria-labelledby="session-title">
    <button class="dialog-close" data-close aria-label="Back to game" hidden>×</button>
    <h1 id="session-title">Play</h1>
    <form id="game-picker" hidden>
        <label>Game: <select id="game-select" aria-label="Game"></select></label>
        <button type="submit" id="btn-play">Play</button>
        <span>Installed games and saves stay on this device.</span>
    </form>
    <div id="controls">
        <label>ROM: <input type="file" id="rom-file"></label>
        <label>RPKG: <input type="file" id="rpkg-file"></label>
        <label>SIS: <input type="file" id="sis-file"></label>
        <label>App: <input type="text" id="app-name" placeholder="App name or UID" size="20"></label>
        <button id="btn-start" onclick="startEmulator()">Start</button>
    </div>
    <div id="game-controls" hidden aria-label="Game options">
        <button id="btn-sound" type="button" disabled aria-pressed="false" onclick="EkaAudio.toggle()">Enable sound</button>
        <button id="btn-touch-settings" type="button">Touch controls</button>
        <button id="btn-keypad" type="button">Phone keypad</button>
        <button id="btn-fullscreen" type="button">Full screen</button>
        <button id="btn-save-device" type="button" disabled>Save device</button>
        <span id="device-status" role="status"></span>
    </div>
    <div id="status" role="status">Ready</div>
    <details id="log-panel"><summary>Diagnostics</summary><div id="log" role="log"></div></details>
    </dialog>
    <div id="play-surface">
        <div id="canvas-container">
            <canvas id="canvas" tabindex="0" aria-label="Game display" width="360" height="640" oncontextmenu="event.preventDefault()"></canvas>
        </div>
        <div id="touch-deck" hidden aria-label="Touch game controls"></div>
        <button id="btn-game-menu" type="button" aria-label="Game options" hidden><span aria-hidden="true">☰</span></button>
        <span id="fps-counter" hidden title="Emulator frame presentations per second, averaged over two seconds">— FPS</span>
        <div id="control-hint" hidden>Drag controls to move them. Tap ✓ when finished.</div>
    </div>

    <script>
        var Module = window.Module || {async: true};
        Module.canvas = document.getElementById('canvas');

        // Console output stays complete. The optional DOM view holds only a
        // bounded tail and does no rendering/layout work while collapsed.
        var _logBuffer = [], _logBytes = 0, _logTimer = null;
        var _logTail = [], _logTailBytes = 0, _logTrimmed = false, _logPaint = null;
        var _origPrint = Module.print, _origPrintErr = Module.printErr;
        function _rememberLog(text) {
            var lines = String(text).split('\n');
            for (var line of lines) {
                if (line.length > 32767) { line = line.slice(-32767); _logTrimmed = true; }
                _logTail.push(line);
                _logTailBytes += line.length + 1;
                while (_logTail.length > 200 || _logTailBytes > 32768) {
                    _logTailBytes -= _logTail.shift().length + 1;
                    _logTrimmed = true;
                }
            }
            _scheduleLogPaint();
        }
        function _scheduleLogPaint() {
            var panel = document.getElementById('log-panel');
            if (!panel.open || _logPaint !== null) return;
            _logPaint = requestAnimationFrame(function() {
                _logPaint = null;
                if (!panel.open) return;
                var log = document.getElementById('log');
                log.textContent = (_logTrimmed ? '[Earlier log entries omitted]\n' : '') + _logTail.join('\n');
                log.scrollTop = 2147483647;
            });
        }
        document.getElementById('log-panel').addEventListener('toggle', _scheduleLogPaint);
        function _flushLog() {
            if (_logTimer !== null) { clearTimeout(_logTimer); _logTimer = null; }
            if (!_logBuffer.length) return;
            var batch = _logBuffer.join('\n');
            _logBuffer = []; _logBytes = 0;
            console.log(batch);
            _rememberLog(batch);
            if (_origPrint) _origPrint(batch);
        }
        Module.print = function(text) {
            text = String(text);
            _logBuffer.push(text); _logBytes += text.length + 1;
            if (_logBytes >= 32768) _flushLog();
            else if (_logTimer === null) _logTimer = setTimeout(_flushLog, 200);
        };
        window._flushLog = _flushLog;
        Module.printErr = function(text) {
            if (text && text.indexOf('__syscall_mprotect') !== -1) return;
            _flushLog();
            console.warn(text);
            _rememberLog('[ERR] ' + text);
            if (_origPrintErr) _origPrintErr(text);
        };
        var _origOnAbort = Module.onAbort;
        Module.onAbort = function(what) {
            console.error('ABORT:', what);
            if (_origOnAbort) _origOnAbort(what);
        };
        Module.setStatus = Module.setStatus || function(text) {
            console.log('[status] ' + (text || 'Ready'));
            document.getElementById('status').textContent = text || 'Ready';
        };

        function writeGuestFile(path, data) {
            // WasmFS in our SDK appends in FS.writeFile. Truncate explicitly,
            // then use its bulk copy rather than FS.write's per-byte JS loop.
            var stream = FS.open(path, 'w');
            FS.close(stream);
            if (data.length) FS.writeFile(path, data);
        }

        function canStageInOpfs() {
            if (!navigator.storage?.getDirectory) return false;
            try { return (FS.stat('/opfs').mode & 0o170000) === 0o040000; }
            catch (_) { return false; }
        }

        async function stageStreamInOpfs(name, expectedSize, getStream, boundedWrites = false) {
            if (!canStageInOpfs()) return null;
            var stream = getStream();
            if (!stream) return null;
            var root = await navigator.storage.getDirectory();
            var dot = name.lastIndexOf('.');
            var stagedName = 'eka2l1-stage-' + crypto.randomUUID() + (dot < 0 ? '' : name.slice(dot));
            var handle = await root.getFileHandle(stagedName, {create: true});
            try {
                var staged = '/opfs/' + stagedName;
                var receivedSize = 0;
                if (boundedWrites) {
                    var writable = await handle.createWritable();
                    var reader = stream.getReader();
                    try {
                        while (true) {
                            var chunk = await reader.read();
                            if (chunk.done) break;
                            receivedSize += chunk.value.length;
                            for (var offset = 0; offset < chunk.value.length; offset += 64 * 1024)
                                await writable.write(chunk.value.subarray(offset, offset + 64 * 1024));
                        }
                        await writable.close();
                    } catch (error) {
                        await writable.abort().catch(() => {});
                        await reader.cancel(error).catch(() => {});
                        throw error;
                    } finally { reader.releaseLock(); }
                } else {
                    await stream.pipeTo(await handle.createWritable());
                }
                if ((expectedSize !== null || boundedWrites)
                        && FS.stat(staged).size !== (expectedSize ?? receivedSize))
                    throw new Error('Incomplete staged upload');
                return staged;
            } catch (error) {
                await root.removeEntry(stagedName).catch(() => {});
                throw error;
            }
        }

        async function uploadFile(file, path, stageInOpfs = false) {
            if (stageInOpfs) {
                var staged = await stageStreamInOpfs(file.name, file.size, () => file.stream());
                if (staged) return staged;
            }
            return new Promise(function(resolve, reject) {
                var reader = new FileReader();
                reader.onload = function() {
                    var data = new Uint8Array(reader.result);
                    try {
                        // Ensure parent directories exist
                        var parts = path.split('/');
                        var dir = '';
                        for (var i = 0; i < parts.length - 1; i++) {
                            dir += '/' + parts[i];
                            try { FS.mkdir(dir); } catch(e) {async: true}
                        }
                        writeGuestFile(path, data);
                        resolve(path);
                    } catch(e) {
                        reject(e);
                    }
                };
                reader.onerror = reject;
                reader.readAsArrayBuffer(file);
            });
        }

        var _gameRunning = false;
        var _selectedGame = null;
        function deviceStatus(text) { document.getElementById('device-status').textContent = text; }
        function enableDeviceSaving() {
            if (!window.ekaDeviceDisk) return;
            document.getElementById('btn-save-device').disabled = false;
            window.ekaDeviceDisk.start().catch(error => Module.printErr(String(error)));
        }
        async function recycleCpuWorker() {
            var thread = Module._eka2l1_request_cpu_recycle();
            if (thread < 0) throw new Error('Could not stop the CPU worker');
            var worker = PThread.pthreads[thread];
            if (!worker) throw new Error('CPU worker was not found');
            var deadline = performance.now() + 30000;
            while (!Module._eka2l1_cpu_recycle_ready()) {
                if (performance.now() > deadline) throw new Error('CPU worker did not stop');
                await new Promise(resolve => setTimeout(resolve, 10));
            }
            var joined = Module._eka2l1_join_cpu_recycle();
            if (joined !== 0) throw new Error('Could not join CPU worker: ' + joined);
            while (!PThread.unusedWorkers.includes(worker)) {
                if (performance.now() > deadline) throw new Error('CPU worker was not released');
                await new Promise(resolve => setTimeout(resolve, 10));
            }
            PThread.unusedWorkers.splice(PThread.unusedWorkers.indexOf(worker), 1);
            terminateWorker(worker);
            await new Promise(resolve => setTimeout(resolve, 200));
            var resumed = Module._eka2l1_resume_cpu_recycle();
            if (resumed !== 0) throw new Error('Could not resume CPU worker: ' + resumed);
        }
        document.getElementById('btn-save-device').addEventListener('click', function() {
            window.ekaDeviceDisk?.save(true).catch(error => Module.printErr(String(error)));
        });
        document.addEventListener('visibilitychange', function() {
            if (document.hidden && window.ekaDeviceDisk?.canSave)
                window.ekaDeviceDisk.save(true).catch(error => console.warn('[device-disk]', error.message));
        });
        function assetHash(endpoint) {
            var url = window.ekaAssetUrls?.[endpoint] || endpoint;
            return url ? new URL(url, location.href).searchParams.get('v') : '';
        }
        async function prepareDeviceStorage(game) {
            if (window.ekaTransientSession || Module._eka2l1_route_phase() !== -1) return null;
            while (!Module._eka2l1_opfs_status?.()) await new Promise(resolve => setTimeout(resolve, 10));
            var rom = assetHash('/preload/rom');
            var rpkg = assetHash('/preload/rpkg');
            if (!game) {
                var romFile = document.getElementById('rom-file').files[0];
                var rpkgFile = document.getElementById('rpkg-file').files[0];
                if (romFile) {
                    rom = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', await romFile.arrayBuffer())))
                        .map(byte => byte.toString(16).padStart(2, '0')).join('');
                    rpkg = rpkgFile ? Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', await rpkgFile.arrayBuffer())))
                        .map(byte => byte.toString(16).padStart(2, '0')).join('') : '';
                }
            }
            if (!rom) throw new Error('Choose a ROM for this device');
            Module.setStatus('Opening saved device...');
            window.ekaDeviceDisk = await EkaDeviceDisk.open(rom + ':' + (rpkg || ''), FS, Module, deviceStatus);
            return window.ekaDeviceDisk;
        }
        var _fpsSamples = [];
        document.addEventListener('visibilitychange', function() { _fpsSamples = []; });
        // Use guest presentations and actual elapsed host time. A delayed timer
        // includes the stall; background tabs start a fresh window on return.
        setInterval(function() {
            var display = document.getElementById('fps-counter');
            display.hidden = !_gameRunning;
            if (!_gameRunning || document.hidden || !Module.calledRun) {
                _fpsSamples = [];
                display.textContent = '— FPS';
                return;
            }
            var now = performance.now(), frames = Module._eka2l1_presentations();
            if (_fpsSamples.length && frames < _fpsSamples[_fpsSamples.length - 1].frames) _fpsSamples = [];
            _fpsSamples.push({time: now, frames: frames});
            while (_fpsSamples.length > 2 && now - _fpsSamples[1].time >= 2000) _fpsSamples.shift();
            var first = _fpsSamples[0];
            if (now > first.time) display.textContent = ((frames - first.frames) * 1000 / (now - first.time)).toFixed(1) + ' FPS';
        }, 500);
        var _inputSources = new Map();
        // S60 softkeys use Device0/Device1 scan codes.
        var _keyScans = {ArrowLeft:14, ArrowRight:15, ArrowUp:16, ArrowDown:17,
            KeyA:14, KeyD:15, KeyW:16, KeyS:17, Enter:167, NumpadEnter:167,
            Space:167, F1:164, F2:165, Escape:165};
        // Phone digits use their character scan codes, as in the native frontend.
        for (var digit = 0; digit <= 9; digit++) {
            _keyScans['Digit' + digit] = _keyScans['Numpad' + digit] = 48 + digit;
        }
        function _pressSource(source, scan) {
            if (!_gameRunning || _inputSources.has(source)) return;
            var alreadyDown = Array.from(_inputSources.values()).includes(scan);
            _inputSources.set(source, scan);
            if (!alreadyDown) Module._eka2l1_key_state(scan, 1);
            window.ekaTouchControls?.reflect();
        }
        function _releaseSource(source) {
            if (!_inputSources.has(source)) return;
            var scan = _inputSources.get(source);
            _inputSources.delete(source);
            if (!Array.from(_inputSources.values()).includes(scan)) Module._eka2l1_key_state(scan, 0);
            window.ekaTouchControls?.reflect();
        }
        function _releaseInputs() {
            for (var source of Array.from(_inputSources.keys())) _releaseSource(source);
            window.ekaTouchControls?.reset();
        }
        window.addEventListener('keydown', function(event) {
            if (!_gameRunning || window.ekaTouchControls?.modalOpen || window.ekaTouchControls?.editing
                || event.target.closest('input, select, textarea, button') || !(_keyScans[event.code])) return;
            event.preventDefault();
            _pressSource('key:' + event.code, event.code === 'Space'
                ? (window.ekaTouchControls?.prefs.action || 167) : _keyScans[event.code]);
        });
        window.addEventListener('keyup', function(event) {
            if (_inputSources.has('key:' + event.code)) event.preventDefault();
            _releaseSource('key:' + event.code);
        });
        window.addEventListener('blur', _releaseInputs);
        document.addEventListener('visibilitychange', function() { if (document.hidden) _releaseInputs(); });

        async function configureGameLauncher(games, defaultGame) {
            var picker = document.getElementById('game-picker');
            var select = document.getElementById('game-select');
            for (var game of games) select.add(new Option(game.title, game.id));
            select.add(new Option('Load my own files', 'custom'));
            var requested = new URL(location.href).searchParams.get('game');
            var selected = games.find(game => game.id === (requested || defaultGame));
            select.value = requested === 'custom' ? 'custom' : (selected || games[0]).id;
            picker.hidden = false;
            document.getElementById('controls').hidden = requested !== 'custom';
            picker.addEventListener('submit', async function(event) {
                event.preventDefault();
                _releaseInputs();
                var url = new URL(location.href);
                url.searchParams.set('game', select.value);
                url.searchParams.delete('counting');
                // Reload releases the previous workers, audio and guest memory.
                try {
                    if (window.ekaDeviceDisk) await window.ekaDeviceDisk.stop();
                    await window.ekaNgageCleanup?.();
                    location.assign(url.href);
                } catch (error) { deviceStatus('Device not saved: ' + error.message); }
            });
            if (requested === 'custom') return;
            if (!selected) {
                Module.setStatus(requested ? 'Unknown game. Choose a game and press Play.' : 'Choose a game and press Play.');
                return;
            }
            try {
                while (!Module.calledRun) await new Promise(resolve => setTimeout(resolve, 100));
                Module.setStatus('Loading ' + selected.title + '...');
                _selectedGame = selected;
                window.ekaRomCachePreparation = EkaRomCache.prepare(selected.romCache);
                var disk = await prepareDeviceStorage(selected);
                var useImage = selected.image && !disk?.manifest && !window.ekaForceFreshInstall;
                var needsSis = !disk?.installed[assetHash(selected.sis)];
                var needsNgage = selected.ngage && !disk?.installed[assetHash(selected.ngage)];
                if (window.ekaBenchmarkRouteUs && (needsNgage
                        ? Module._eka2l1_route_configure_64(window.ekaBenchmarkRouteUs >>> 0,
                            Math.floor(window.ekaBenchmarkRouteUs / 4294967296))
                        : Module._eka2l1_route_configure(window.ekaBenchmarkRouteUs)) !== 0)
                    throw new Error('Benchmark route configuration failed');
                for (var [endpoint, selector, name] of (useImage ? [] : [
                    ['/preload/rom', 'rom-file', 'SYM.ROM'],
                    ['/preload/rpkg', 'rpkg-file', 'SYM.RPKG'],
                    [selected.sis, 'sis-file', selected.id + '.sis']])) {
                    if (!endpoint) continue;
                    if (disk?.manifest && selector !== 'sis-file') continue;
                    if (selector === 'sis-file' && !needsSis) continue;
                    var response = await window.ekaDownload(endpoint);
                    if (!response.ok) throw new Error('Download failed: HTTP ' + response.status);
                    var transfer = new DataTransfer();
                    transfer.items.add(new File([await response.blob()], name));
                    document.getElementById(selector).files = transfer.files;
                }
                document.getElementById('app-name').value = selected.uid;
                await startEmulator(useImage ? undefined : needsNgage ? selected.ngage : undefined,
                    useImage ? selected.image : undefined);
                if (_gameRunning) setRunningStatus(selected.title);
            } catch (error) {
                Module.setStatus('Error: ' + error.message);
                Module.printErr(String(error));
            }
        }

        function setRunningStatus(title) {
            Module.setStatus('Running: ' + title
                + ' · Arrows/WASD to move, Enter to select'
                + (window.ekaTouchControls?.profile === 'k-rally' ? ', Space/4 to accelerate, 7 for turbo' : '')
                + ' · Use Enable sound for audio');
        }

        async function startEmulator(ngagePackage, installedImage) {
            var btn = document.getElementById('btn-start');
            btn.disabled = true;
            Module.setStatus('Initializing...');
            var cleanupNgageStaging = null;
            var ngageTimer = null;

            try {
                var romInput = document.getElementById('rom-file');
                var rpkgInput = document.getElementById('rpkg-file');
                var sisInput = document.getElementById('sis-file');
                var appName = document.getElementById('app-name').value;
                var disk = window.ekaDeviceDisk || await prepareDeviceStorage(_selectedGame);
                var sisHash = _selectedGame ? assetHash(_selectedGame.sis) : '';
                if (disk && !_selectedGame) {
                    if (disk.manifest) { romInput.value = ''; rpkgInput.value = ''; }
                    if (sisInput.files[0]) {
                        sisHash = Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256', await sisInput.files[0].arrayBuffer())))
                            .map(byte => byte.toString(16).padStart(2, '0')).join('');
                        if (disk.installed[sisHash]) sisInput.value = '';
                    }
                }

                // The runtime defaults to immutable executable bytes (mode 3).
                await window.ekaRomCachePreparation;
                // A launcher can select compatibility mode 0 before initialization.
                window.ekaUnsafeCode = Module.ccall('eka2l1_unsafe_code_report', 'number', [], []);
                if (![0,1,2,3].includes(window.ekaUnsafeCode))
                    throw new Error('Executable-byte policy readback failed');
                // Live play selects pacing before starting the compiled CPU.
                if (Module.ccall('eka2l1_live_configure', 'number', [], []) !== 0)
                    throw new Error('Live configuration failed');
                if (installedImage) {
                    Module.setStatus('Loading installed game...');
                    var restored = await EkaInstalledImage.restore(
                        await window.ekaDownload(installedImage.url), installedImage, FS);
                    console.log('[installed-image] Restored ' + restored.files + ' files (' + restored.bytes + ' bytes)');
                    if (disk) {
                        disk.installed[installedImage.sources.game] = true;
                        disk.installed[installedImage.sources.runtime] = true;
                    }
                }
                // Initialize after restoring devices.yml and installed registries.
                var initResult = await Module.ccall('eka2l1_init', 'number', ['string'], ['/data'], {async: true});
                if (initResult !== 0) throw new Error('Initialization failed: ' + initResult);

                // Install device if ROM provided
                if (romInput.files.length > 0) {
                    var romPath = '', rpkgPath = '', ret;
                    try {
                        Module.setStatus('Uploading ROM...');
                        romPath = await uploadFile(romInput.files[0], '/tmp/' + romInput.files[0].name, true);
                        if (rpkgInput.files.length > 0) {
                            Module.setStatus('Uploading RPKG...');
                            rpkgPath = await uploadFile(rpkgInput.files[0], '/tmp/' + rpkgInput.files[0].name, true);
                        }
                        Module.setStatus('Installing device...');
                        ret = await Module.ccall('eka2l1_install_device', 'number', ['string', 'string', 'string', 'string'],
                            [romPath, rpkgPath, disk?.romOffloadRoot || '', disk?.firmwareOffloadRoot || ''], {async: true});
                    } finally {
                        // WasmFS analyzePath reads the whole file; unlink directly after installation.
                        for (var uploaded of new Set([romPath, rpkgPath])) {
                            if (!uploaded) continue;
                            try { FS.unlink(uploaded); }
                            catch (error) { if (error.errno !== 44) throw error; }
                        }
                    }
                    if (ret !== 0) {
                        throw new Error('Device installation failed: ' + ret);
                    }
                    romInput.value = ''; rpkgInput.value = '';
                }

                // Install SIS if provided
                if (sisInput.files.length > 0) {
                    Module.setStatus('Uploading SIS...');
                    var sisFile = sisInput.files[0];
                    var sisPath = await uploadFile(sisFile, '/tmp/' + sisFile.name, sisFile.size >= 8 * 1024 * 1024);
                    Module.setStatus('Installing SIS...');
                    var ret;
                    try {
                        ret = await Module.ccall('eka2l1_install_sis', 'number', ['string'], [sisPath], {async: true});
                    } finally {
                        FS.unlink(sisPath);
                    }
                    sisInput.value = '';
                    if (ret !== 0) {
                        if (ngagePackage) throw new Error('N-Gage runtime installation failed: ' + ret);
                        Module.printErr('SIS install returned ' + ret + ' (may already be in ROM)');
                    } else if (disk && sisHash) {
                        disk.installed[sisHash] = true;
                    }
                }

                if (disk) {
                    try { await disk.offloadRom(); }
                    catch (error) { console.warn('[device-disk] Read-only offload unavailable:', error); }
                }

                // N-Gage registers and licenses games through its own importer.
                if (ngagePackage) {
                    Module.setStatus('Preparing N-Gage game...');
                    var importPolls = 0, earlyRecycled = false, earlyRecycling = false;
                    var streamToOpfs = canStageInOpfs();
                    var packageResponse = await window.ekaDownload(ngagePackage,
                        streamToOpfs ? {stream: true} : undefined);
                    if (!packageResponse.ok) throw new Error('N-Gage download failed: HTTP ' + packageResponse.status);
                    var guestPackage = '/data/drives/e/n-gage/game.n-gage';
                    var contentLength = packageResponse.headers.get('Content-Length');
                    var expectedSize = contentLength === null ? null : Number(contentLength);
                    if (expectedSize !== null && (!Number.isSafeInteger(expectedSize) || expectedSize < 0))
                        throw new Error('Invalid N-Gage package size');
                    var stagedPackage = streamToOpfs
                        ? await stageStreamInOpfs('game.n-gage', expectedSize, () => packageResponse.body, true)
                        : null;
                    FS.mkdirTree('/data/drives/e/n-gage');
                    if (stagedPackage) {
                        cleanupNgageStaging = async function() {
                            try {
